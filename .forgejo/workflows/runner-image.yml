name: Test action

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  registry: git.amarth.cloud
  owner: chris
  image: default
  tag: latest

jobs:
  hello:
    name: Print hello world
    runs-on: default
    steps:
      - name: Pull dependencies
        run: >-
          git clone https://${{ env.registry }}/${{ env.owner }}/sneeuwvlok.git
          && cd sneeuwvlok

      - name: Install docker
        run: nix-env -iA nixpkgs.podman

      - name: __DEBUG__
        run: which podman

      - name: Log into registry
        run: docker login ${{ env.registry }}

      - name: Build image
        run: >-
          docker build
          -t ${{ env.registry }}/${{ env.owner }}/${{ env.image }}:${{ env.tag }} ./modules/nixos/services/development/forgejo/Dockerfile.default

      - name: Push image
        run: docker push ${{ env.registry }}/${{ env.owner }}/${{ env.image }}:${{ env.tag }}