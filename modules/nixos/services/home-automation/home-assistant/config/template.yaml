# The mood lighting follows the plugs, the dinner table lamp joins in at 25% unless dinner mode has it at full brightness
- switch:
    - name: Sfeerverlichting
      unique_id: mood_lighting
      default_entity_id: switch.mood_lighting
      icon: mdi:lamps
      state: "{{ is_state('group.mood_lighting_plugs', 'on') }}"
      turn_on:
        - action: homeassistant.turn_on
          target:
            entity_id: group.mood_lighting_plugs
        - if:
            - condition: state
              entity_id: input_boolean.dinner_mode
              state: "off"
          then:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 25
      turn_off:
        - action: homeassistant.turn_off
          target:
            entity_id: group.mood_lighting_plugs
        - if:
            - condition: state
              entity_id: input_boolean.dinner_mode
              state: "off"
          then:
            - action: light.turn_off
              target:
                entity_id: light.lamp_eettafel

# Whether the mood lighting belongs on: from 30 minutes before sunset until 30 minutes after sunrise, while someone is home.
# Before sunrise the next rising comes before the next setting. The 30 minutes after sunrise are measured from a day before
# the next rising, which is off by the few minutes sunrise shifts per day.
# Turning off waits 10 minutes, so a phone briefly dropping the wifi at home doesn't count as leaving.
- binary_sensor:
    - name: Sfeerverlichting gewenst
      unique_id: mood_lighting_wanted
      default_entity_id: binary_sensor.mood_lighting_wanted
      icon: mdi:weather-sunset
      delay_off:
        minutes: 10
      availability: "{{ has_value('sensor.sun_next_rising') and has_value('sensor.sun_next_setting') }}"
      state: >
        {% set buffer = timedelta(minutes=30) %}
        {% set rising = states('sensor.sun_next_rising') | as_datetime %}
        {% set setting = states('sensor.sun_next_setting') | as_datetime %}
        {% set dark = rising < setting
          or setting - now() <= buffer
          or now() - (rising - timedelta(days=1)) <= buffer %}
        {{ dark and states('zone.home') | int(0) > 0 }}

# When the phone last connected to the wifi at work. A trigger based sensor keeps its state through restarts.
- triggers:
    - trigger: state
      entity_id: sensor.sm_g986b_wi_fi_connection
      to: 4DotNet
  sensor:
    - name: Laatst op werk
      unique_id: last_at_work
      default_entity_id: sensor.last_at_work
      icon: mdi:briefcase
      device_class: timestamp
      state: "{{ now().isoformat() }}"

# Whether I'm in the car, the phone connects to the car's own wifi as soon as it is on
- binary_sensor:
    - name: In de auto
      unique_id: in_car
      default_entity_id: binary_sensor.in_car
      icon: mdi:car
      availability: "{{ has_value('sensor.sm_g986b_wi_fi_connection') }}"
      state: "{{ is_state('sensor.sm_g986b_wi_fi_connection', 'My Peugeot RS074545') }}"
