# Dinner mode puts the dinner table lamp at full brightness, turning it off hands the lamp back to the mood lighting
- id: dinner_mode
  alias: Eetmodus
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.dinner_mode
      to:
        - "on"
        - "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.dinner_mode
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 100
                transition: 0.5
        - conditions:
            - condition: state
              entity_id: switch.mood_lighting
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 25
                transition: 0.5
      default:
        - action: light.turn_off
          target:
            entity_id: light.lamp_eettafel
          data:
            transition: 0.5

# Coming home when it is getting dark turns the mood lighting on. The router tracks the phone joining the wifi, the phone
# itself can't tell home assistant it left because home assistant is only reachable from the home network. Unifi marks the
# phone away after 5 minutes off the wifi, requiring another 5 keeps the phone briefly dropping the wifi at home from
# turning the lights back on.
- id: mood_lighting_on_arrival
  alias: Sfeerverlichting bij thuiskomst
  triggers:
    - trigger: state
      entity_id: device_tracker.galaxy_s20_5g
      from: not_home
      to: home
  conditions:
    - condition: template
      value_template: "{{ now() - trigger.from_state.last_changed > timedelta(minutes=5) }}"
    - condition: sun
      after: sunset
      after_offset: "-00:30:00"
      before: sunrise
      before_offset: "00:30:00"
    - condition: state
      entity_id: switch.mood_lighting
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.mood_lighting
