# Dinner mode puts the dinner table lamp at full brightness, turning it off hands the lamp back to the mood lighting
- id: dinner_mode
  alias: Eetmodus
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.dinner_mode
      to:
        - "on"
        - "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.dinner_mode
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 100
                transition: 0.5
        - conditions:
            - condition: state
              entity_id: switch.mood_lighting
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 25
                transition: 0.5
      default:
        - action: light.turn_off
          target:
            entity_id: light.lamp_eettafel
          data:
            transition: 0.5

# The mood lighting follows whether it is wanted, see the binary sensor in template.yaml. Only the moment that changes acts,
# so switching the lights by hand in between sticks. Coming out of unknown or unavailable is a restart, not a change.
- id: mood_lighting
  alias: Sfeerverlichting automatisch
  triggers:
    - trigger: state
      entity_id: binary_sensor.mood_lighting_wanted
      to:
        - "on"
        - "off"
      not_from:
        - unknown
        - unavailable
  actions:
    - action: switch.turn_{{ trigger.to_state.state }}
      target:
        entity_id: switch.mood_lighting

# The tv's network is off in standby, so the webostv integration can't turn it on. It asks instead, and a magic packet wakes it.
# The tv's entity is renamed to media_player.tv after pairing, unifi knows its mac.
- id: tv_turn_on
  alias: Tv aanzetten
  triggers:
    - trigger: webostv.turn_on
      entity_id: media_player.tv
  actions:
    - action: wake_on_lan.send_magic_packet
      data:
        mac: 74:c1:7e:e4:a7:0e

# Coming home from work starts youtube on the tv. From work means the phone was on the wifi at work since leaving home, see
# sensor.last_at_work in template.yaml. A tv that is already on is in use, so it is left alone.
- id: tv_home_from_work
  alias: Tv na het werk
  triggers:
    - trigger: state
      entity_id: person.chris
      from: not_home
      to: home
  conditions:
    - condition: template
      value_template: >
        {% set at_work = states('sensor.last_at_work') | as_datetime(none) %}
        {{ at_work is not none and at_work > trigger.from_state.last_changed }}
    - condition: state
      entity_id: media_player.tv
      state: "off"
  actions:
    - action: media_player.turn_on
      target:
        entity_id: media_player.tv
    # Waking the tv takes a while, and it only takes commands once it is connected
    - wait_template: "{{ not is_state('media_player.tv', ['off', 'unavailable', 'unknown']) }}"
      timeout: "00:01:00"
      continue_on_timeout: false
    - action: media_player.select_source
      target:
        entity_id: media_player.tv
      data:
        source: YouTube AdFree
