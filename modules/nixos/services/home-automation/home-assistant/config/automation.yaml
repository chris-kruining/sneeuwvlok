# Dinner mode puts the dinner table lamp at full brightness, turning it off hands the lamp back to the mood lighting
- id: dinner_mode
  alias: Eetmodus
  mode: restart
  triggers:
    - trigger: state
      entity_id: input_boolean.dinner_mode
      to:
        - "on"
        - "off"
  actions:
    - choose:
        - conditions:
            - condition: state
              entity_id: input_boolean.dinner_mode
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 100
                transition: 0.5
        - conditions:
            - condition: state
              entity_id: switch.mood_lighting
              state: "on"
          sequence:
            - action: light.turn_on
              target:
                entity_id: light.lamp_eettafel
              data:
                brightness_pct: 25
                transition: 0.5
      default:
        - action: light.turn_off
          target:
            entity_id: light.lamp_eettafel
          data:
            transition: 0.5

# The mood lighting belongs on while it is getting dark and someone is home, so it turns on whenever the last of those two
# becomes true. Only the moment it becomes true acts, turning the lights off by hand afterwards sticks.
#
# Being home comes from the person, which follows the router seeing the phone on the wifi. Unifi marks the phone away after
# 5 minutes off the wifi, requiring another 5 keeps the phone briefly dropping the wifi at home from turning the lights back on.
- id: mood_lighting_on
  alias: Sfeerverlichting aan
  triggers:
    - trigger: sun
      event: sunset
      offset: "-00:30:00"
      id: dusk
    - trigger: state
      entity_id: person.chris
      to: home
      not_from:
        - unknown
        - unavailable
      id: arrival
  conditions:
    - condition: template
      value_template: "{{ trigger.id != 'arrival' or now() - trigger.from_state.last_changed > timedelta(minutes=5) }}"
    - condition: sun
      after: sunset
      after_offset: "-00:30:00"
      before: sunrise
      before_offset: "00:30:00"
    - condition: state
      entity_id: person.chris
      state: home
    - condition: state
      entity_id: switch.mood_lighting
      state: "off"
  actions:
    - action: switch.turn_on
      target:
        entity_id: switch.mood_lighting
